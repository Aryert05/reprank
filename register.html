<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create your account — RepRank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="min-h-screen bg-ink-950">
  <div id="navbar-mount"></div>

  <main class="mx-auto flex min-h-[calc(100vh-64px)] max-w-md flex-col justify-center px-4 py-16 sm:px-6">
    <div class="mb-8 text-center">
      <span class="mx-auto grid h-12 w-12 place-items-center rounded-xl bg-volt font-display text-xl font-bold text-ink-950">R</span>
      <h1 class="mt-4 text-2xl font-semibold text-mist-100">Create your account</h1>
      <p class="mt-1 text-sm text-mist-400">Start at Level 1. Everyone does.</p>
    </div>

    <form id="register-form" class="card space-y-5" novalidate>
      <div>
        <label for="name" class="field-label">Full name</label>
        <input id="name" name="name" type="text" autocomplete="name" placeholder="Aditi Sharma" class="field-input" required />
      </div>

      <div>
        <label for="reg-email" class="field-label">Email</label>
        <input id="reg-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" class="field-input" required />
      </div>

      <div>
        <label for="reg-password" class="field-label">Password</label>
        <input id="reg-password" name="password" type="password" autocomplete="new-password" placeholder="••••••••" class="field-input" required />
      </div>

      <div>
        <label for="confirm-password" class="field-label">Confirm password</label>
        <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" placeholder="••••••••" class="field-input" required />
        <p id="match-warning" class="mt-1.5 hidden text-xs text-volt">Passwords don't match yet.</p>
      </div>

      <button type="submit" class="btn-primary w-full">Register</button>

      <p class="text-center text-sm text-mist-400">
        Already have an account?
        <a href="/login.html" class="font-medium text-volt hover:text-volt-400">Log in</a>
      </p>
    </form>

    <p class="mt-6 text-center text-xs text-mist-400">
      Experiment 1 demo — this form is frontend-only, no account is created or stored.
    </p>
  </main>

  <div id="footer-mount"></div>

  <script type="module" src="/src/pages/register.js"></script>
</body>
</html>
